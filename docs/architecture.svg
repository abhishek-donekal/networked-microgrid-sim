<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 1000" width="1400" height="1000" font-family="Arial, Helvetica, sans-serif">
  <title>Hybrid AC/DC networked microgrid architecture</title>
  <defs>
    <style>
      .wire { stroke: #333; stroke-width: 1.6; fill: none; }
      .acbus { stroke: #1f5fa8; stroke-width: 8; stroke-linecap: butt; }
      .dcbus { stroke: #b5651d; stroke-width: 8; stroke-linecap: butt; }
      .box { fill: #fff; stroke: #333; stroke-width: 1.6; }
      .load { fill: #eceff1; stroke: #333; stroke-width: 1.4; }
      .mg { fill: #fafafa; stroke: #555; stroke-width: 1.4; }
      .storage { fill: #d9efd3; stroke: #333; stroke-width: 1.4; }
      .fuel { fill: #d5e8f7; stroke: #333; stroke-width: 1.4; }
      .ev { fill: #e6dcf3; stroke: #333; stroke-width: 1.4; }
      .renew { fill: #fdf0bf; stroke: #333; stroke-width: 1.4; }
      .t { font-size: 13px; fill: #111; text-anchor: middle; }
      .s { font-size: 11px; fill: #111; text-anchor: middle; }
      .lbl { font-size: 13px; fill: #111; }
      .bold { font-weight: bold; }
      .mgt { font-size: 16px; font-weight: bold; fill: #111; text-anchor: middle; }
      .side { font-size: 13px; font-weight: bold; letter-spacing: 1px; }
    </style>
    <!-- circuit breaker -->
    <rect id="cb" x="-6" y="-6" width="12" height="12" fill="#fff" stroke="#333" stroke-width="1.4"/>
    <!-- resource branch: origin on the local DC bus -->
    <g id="brDC">
      <line class="wire" x1="0" y1="0" x2="0" y2="160"/>
      <use xlink:href="#cb" href="#cb" y="35"/>
      <rect class="box" x="-27" y="70" width="54" height="40"/>
      <line x1="-27" y1="110" x2="27" y2="70" stroke="#bbb" stroke-width="1"/>
      <text class="s" y="94">DC/DC</text>
    </g>
    <g id="brAC">
      <line class="wire" x1="0" y1="0" x2="0" y2="160"/>
      <use xlink:href="#cb" href="#cb" y="35"/>
      <rect class="box" x="-27" y="70" width="54" height="40"/>
      <line x1="-27" y1="110" x2="27" y2="70" stroke="#bbb" stroke-width="1"/>
      <text class="s" y="94">AC/DC</text>
    </g>
    <!-- interlinking converter (IBR): origin at top centre -->
    <g id="ibr">
      <rect x="-32" y="0" width="64" height="60" fill="#fff" stroke="#c0392b" stroke-width="2.4"/>
      <line x1="-32" y1="60" x2="32" y2="0" stroke="#bbb" stroke-width="1"/>
      <text class="t bold" y="27">AC</text>
      <text class="t bold" y="47">DC</text>
    </g>
  </defs>

  <rect width="1400" height="1000" fill="#fff"/>

  <!-- AC / DC domain divider -->
  <line x1="40" y1="330" x2="1360" y2="330" stroke="#888" stroke-width="1.2" stroke-dasharray="8 6"/>
  <text class="side" x="44" y="318" fill="#1f5fa8">AC SIDE</text>
  <text class="side" x="44" y="350" fill="#b5651d">DC SIDE</text>

  <!-- ================= AC SIDE ================= -->
  <!-- Utility grid -->
  <rect class="box" x="630" y="20" width="140" height="60"/>
  <text class="t bold" x="700" y="55">Utility Grid</text>
  <line class="wire" x1="700" y1="80" x2="700" y2="150"/>
  <use xlink:href="#cb" href="#cb" x="700" y="115"/>

  <!-- Common AC load -->
  <rect class="load" x="500" y="50" width="110" height="45"/>
  <text class="t" x="555" y="70">Common</text>
  <text class="t" x="555" y="86">AC Load</text>
  <line class="wire" x1="555" y1="95" x2="555" y2="150"/>
  <use xlink:href="#cb" href="#cb" x="555" y="122"/>

  <!-- Feeders -->
  <polyline class="wire" points="500,150 500,185 300,185 300,230"/>
  <use xlink:href="#cb" href="#cb" x="460" y="185"/>
  <use xlink:href="#cb" href="#cb" x="340" y="185"/>
  <polyline class="wire" points="900,150 900,185 1100,185 1100,230"/>
  <use xlink:href="#cb" href="#cb" x="940" y="185"/>
  <use xlink:href="#cb" href="#cb" x="1060" y="185"/>

  <!-- Main AC bus -->
  <line class="acbus" x1="480" y1="150" x2="920" y2="150"/>
  <text class="lbl bold" x="930" y="146">Main AC Bus</text>

  <!-- AC Bus 1 + local load -->
  <rect class="load" x="170" y="150" width="100" height="45"/>
  <text class="t" x="220" y="170">Local</text>
  <text class="t" x="220" y="186">AC Load 1</text>
  <line class="wire" x1="220" y1="195" x2="220" y2="230"/>
  <use xlink:href="#cb" href="#cb" x="220" y="212"/>
  <line class="acbus" x1="160" y1="230" x2="440" y2="230"/>
  <text class="lbl bold" x="162" y="252">AC Bus 1</text>

  <!-- AC Bus 2 + local load -->
  <rect class="load" x="1130" y="150" width="100" height="45"/>
  <text class="t" x="1180" y="170">Local</text>
  <text class="t" x="1180" y="186">AC Load 2</text>
  <line class="wire" x1="1180" y1="195" x2="1180" y2="230"/>
  <use xlink:href="#cb" href="#cb" x="1180" y="212"/>
  <line class="acbus" x1="960" y1="230" x2="1240" y2="230"/>
  <text class="lbl bold" x="1238" y="252" text-anchor="end">AC Bus 2</text>

  <!-- ================= INTERLINKING CONVERTERS ================= -->
  <line class="wire" x1="300" y1="230" x2="300" y2="440"/>
  <use xlink:href="#cb" href="#cb" x="300" y="268"/>
  <use xlink:href="#ibr" href="#ibr" x="300" y="300"/>
  <use xlink:href="#cb" href="#cb" x="300" y="398"/>
  <text class="lbl bold" x="344" y="318" fill="#c0392b">IBR 01</text>
  <text class="lbl" x="344" y="352" font-size="12">Bidirectional AC/DC (GFM / GFL)</text>

  <line class="wire" x1="1100" y1="230" x2="1100" y2="440"/>
  <use xlink:href="#cb" href="#cb" x="1100" y="268"/>
  <use xlink:href="#ibr" href="#ibr" x="1100" y="300"/>
  <use xlink:href="#cb" href="#cb" x="1100" y="398"/>
  <text class="lbl bold" x="1144" y="318" fill="#c0392b">IBR 02</text>
  <text class="lbl" x="1144" y="352" font-size="12">Bidirectional AC/DC (GFM / GFL)</text>

  <!-- ================= DC SIDE ================= -->
  <!-- Microgrid frames -->
  <rect class="mg" x="40" y="500" width="500" height="405" rx="4"/>
  <rect class="mg" x="580" y="500" width="360" height="405" rx="4"/>
  <rect class="mg" x="980" y="500" width="380" height="405" rx="4"/>
  <text class="mgt" x="290" y="888">Microgrid 01</text>
  <text class="mgt" x="760" y="888">Microgrid 02</text>
  <text class="mgt" x="1170" y="888">Microgrid 03</text>

  <!-- DC tie-line -->
  <polyline class="wire" points="480,440 480,470 680,470 680,440"/>
  <use xlink:href="#cb" href="#cb" x="540" y="470"/>
  <use xlink:href="#cb" href="#cb" x="620" y="470"/>
  <text class="t bold" x="580" y="492">DC tie-line</text>

  <!-- Common DC load -->
  <rect class="load" x="755" y="360" width="110" height="45"/>
  <text class="t" x="810" y="380">Common</text>
  <text class="t" x="810" y="396">DC Load</text>
  <line class="wire" x1="810" y1="405" x2="810" y2="440"/>
  <use xlink:href="#cb" href="#cb" x="810" y="422"/>

  <!-- Microgrid feeders from upstream DC buses -->
  <line class="wire" x1="300" y1="440" x2="300" y2="640"/>
  <use xlink:href="#cb" href="#cb" x="300" y="565"/>
  <line class="wire" x1="760" y1="440" x2="760" y2="640"/>
  <use xlink:href="#cb" href="#cb" x="760" y="565"/>
  <line class="wire" x1="1170" y1="440" x2="1170" y2="640"/>
  <use xlink:href="#cb" href="#cb" x="1170" y="565"/>

  <!-- Upstream DC buses -->
  <line class="dcbus" x1="60" y1="440" x2="520" y2="440"/>
  <text class="lbl bold" x="62" y="428">DC Bus 1</text>
  <line class="dcbus" x1="640" y1="440" x2="1340" y2="440"/>
  <text class="lbl bold" x="1338" y="428" text-anchor="end">Common DC Bus</text>

  <!-- Microgrid 01 -->
  <rect class="load" x="80" y="540" width="100" height="45"/>
  <text class="t" x="130" y="560">Local</text>
  <text class="t" x="130" y="576">DC Load</text>
  <line class="wire" x1="130" y1="585" x2="130" y2="640"/>
  <use xlink:href="#cb" href="#cb" x="130" y="612"/>

  <use xlink:href="#brDC" href="#brDC" x="110" y="640"/>
  <use xlink:href="#brDC" href="#brDC" x="200" y="640"/>
  <use xlink:href="#brDC" href="#brDC" x="290" y="640"/>
  <use xlink:href="#brDC" href="#brDC" x="380" y="640"/>
  <use xlink:href="#brAC" href="#brAC" x="470" y="640"/>
  <line class="dcbus" x1="70" y1="640" x2="510" y2="640"/>
  <text class="lbl" x="508" y="628" text-anchor="end">Local DC Bus</text>

  <rect class="storage" x="74" y="800" width="72" height="46" rx="3"/><text class="t" x="110" y="828">Battery</text>
  <rect class="fuel" x="164" y="800" width="72" height="46" rx="3"/><text class="t" x="200" y="828">Fuel Cell</text>
  <rect class="ev" x="254" y="800" width="72" height="46" rx="3"/><text class="t" x="290" y="828">EV</text>
  <rect class="renew" x="344" y="800" width="72" height="46" rx="3"/><text class="t" x="380" y="828">Solar PV</text>
  <rect class="renew" x="434" y="800" width="72" height="46" rx="3"/><text class="t" x="470" y="828">Wind</text>

  <!-- Microgrid 02 -->
  <rect class="load" x="610" y="540" width="100" height="45"/>
  <text class="t" x="660" y="560">Local</text>
  <text class="t" x="660" y="576">DC Load</text>
  <line class="wire" x1="660" y1="585" x2="660" y2="640"/>
  <use xlink:href="#cb" href="#cb" x="660" y="612"/>

  <use xlink:href="#brDC" href="#brDC" x="640" y="640"/>
  <use xlink:href="#brDC" href="#brDC" x="720" y="640"/>
  <use xlink:href="#brDC" href="#brDC" x="800" y="640"/>
  <use xlink:href="#brDC" href="#brDC" x="880" y="640"/>
  <line class="dcbus" x1="600" y1="640" x2="920" y2="640"/>
  <text class="lbl" x="918" y="628" text-anchor="end">Local DC Bus</text>

  <rect class="storage" x="604" y="800" width="72" height="46" rx="3"/><text class="t" x="640" y="828">SuperCap</text>
  <rect class="storage" x="684" y="800" width="72" height="46" rx="3"/><text class="t" x="720" y="828">Battery</text>
  <rect class="fuel" x="764" y="800" width="72" height="46" rx="3"/><text class="t" x="800" y="828">Fuel Cell</text>
  <rect class="ev" x="844" y="800" width="72" height="46" rx="3"/><text class="t" x="880" y="828">EV</text>

  <!-- Microgrid 03 -->
  <rect class="load" x="1010" y="540" width="100" height="45"/>
  <text class="t" x="1060" y="560">Local</text>
  <text class="t" x="1060" y="576">DC Load</text>
  <line class="wire" x1="1060" y1="585" x2="1060" y2="640"/>
  <use xlink:href="#cb" href="#cb" x="1060" y="612"/>

  <use xlink:href="#brDC" href="#brDC" x="1070" y="640"/>
  <use xlink:href="#brDC" href="#brDC" x="1170" y="640"/>
  <use xlink:href="#brDC" href="#brDC" x="1270" y="640"/>
  <line class="dcbus" x1="1000" y1="640" x2="1340" y2="640"/>
  <text class="lbl" x="1338" y="628" text-anchor="end">Local DC Bus</text>

  <rect class="storage" x="1034" y="800" width="72" height="46" rx="3"/><text class="t" x="1070" y="828">Battery</text>
  <rect class="fuel" x="1134" y="800" width="72" height="46" rx="3"/><text class="t" x="1170" y="828">Fuel Cell</text>
  <rect class="ev" x="1234" y="800" width="72" height="46" rx="3"/><text class="t" x="1270" y="828">EV</text>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(40,945)">
    <line class="acbus" x1="0" y1="10" x2="40" y2="10"/><text class="lbl" x="48" y="15">AC bus</text>
    <line class="dcbus" x1="120" y1="10" x2="160" y2="10"/><text class="lbl" x="168" y="15">DC bus</text>
    <use xlink:href="#cb" href="#cb" x="246" y="10"/><text class="lbl" x="260" y="15">Breaker / switch</text>
    <rect x="390" y="0" width="22" height="20" fill="#fff" stroke="#c0392b" stroke-width="2.4"/><text class="lbl" x="420" y="15">Interlinking converter (IBR)</text>
    <rect class="storage" x="620" y="0" width="22" height="20"/><text class="lbl" x="650" y="15">Storage</text>
    <rect class="fuel" x="720" y="0" width="22" height="20"/><text class="lbl" x="750" y="15">Fuel cell</text>
    <rect class="ev" x="826" y="0" width="22" height="20"/><text class="lbl" x="856" y="15">EV</text>
    <rect class="renew" x="896" y="0" width="22" height="20"/><text class="lbl" x="926" y="15">Renewable</text>
    <rect class="load" x="1012" y="0" width="22" height="20"/><text class="lbl" x="1042" y="15">Load</text>
  </g>
</svg>
